name: Verify Full Stack Open Part 1

on:
  push:
    branches: [main]
    paths:
      - 'part1/**'
      - '.github/workflows/verify-part1.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [courseinfo, unicafe, anecdotes]

    defaults:
      run:
        working-directory: part1/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Install DOM test dependency
        run: npm install --no-save --no-audit --no-fund jsdom@24.1.3
      - name: Test app rendering and interactions
        run: node ../verify.mjs ${{ matrix.app }}
