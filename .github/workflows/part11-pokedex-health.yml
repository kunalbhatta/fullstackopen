name: Part 11 Pokedex health
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    if: vars.POKEDEX_HEALTH_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check the live service
        env:
          URL: ${{ vars.POKEDEX_HEALTH_URL }}
        run: |
          test "$(curl --fail --retry 2 --silent --show-error --max-time 30 "$URL")" = 'ok'
