name: Part 14 Next.js

on:
  push:
    branches: [fullstackopen-practice]
    paths: ['part14/**', '.github/workflows/part14-nextjs.yml']
  pull_request:
    paths: ['part14/**', '.github/workflows/part14-nextjs.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: practice
          POSTGRES_PASSWORD: practice
          POSTGRES_DB: bloglist
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U practice -d bloglist"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://practice:practice@localhost:5432/bloglist
      NEXTAUTH_SECRET: local-test-only-secret-not-for-deployment
      NEXTAUTH_URL: http://localhost:3000
      CI: true
    defaults:
      run:
        working-directory: part14/bloglist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Apply test database schema
        run: npx drizzle-kit push --force
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Helsinki end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part14-playwright-report
          path: part14/bloglist/playwright-report/
          retention-days: 7
