name: Part 14 Next.js

on:
  push:
    branches: [fullstackopen-practice]
    paths: ['part14/**', '.github/workflows/part14-nextjs.yml']
  pull_request:
    paths: ['part14/**', '.github/workflows/part14-nextjs.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part14/bloglist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://practice:practice@localhost/practice
          NEXTAUTH_SECRET: build-only-local-secret-not-for-deployment
          NEXTAUTH_URL: http://localhost:3000
