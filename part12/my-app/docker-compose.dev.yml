services:
  proxy:
    image: nginx:alpine
    ports: ['8091:80']
    volumes: ['./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [frontend, backend]
  frontend:
    build:
      context: ../..
      dockerfile: part12/my-app/frontend/dev.Dockerfile
    volumes: ['../../part2/phonebook:/app', 'phonebook-client-modules:/app/node_modules']
  backend:
    build:
      context: ../..
      dockerfile: part12/my-app/backend/dev.Dockerfile
    volumes: ['../../part3:/app', 'phonebook-server-modules:/app/node_modules']
    command: ["node", "--watch", "index.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/phonebook
    depends_on:
      mongo: { condition: service_healthy }
  mongo:
    image: mongo:7
    volumes: ['phonebook-mongo:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 3s
      timeout: 5s
      retries: 15
volumes:
  phonebook-mongo:
  phonebook-client-modules:
  phonebook-server-modules:
