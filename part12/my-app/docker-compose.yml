services:
  proxy:
    image: nginx:alpine
    ports: ['8090:80']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [frontend, backend]
  frontend:
    build:
      context: ../..
      dockerfile: part12/my-app/frontend/Dockerfile
  backend:
    build:
      context: ../..
      dockerfile: part12/my-app/backend/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/phonebook
    depends_on:
      mongo: { condition: service_healthy }
  mongo:
    image: mongo:7
    volumes: ['phonebook-mongo:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 3s
      timeout: 5s
      retries: 15
volumes:
  phonebook-mongo:
