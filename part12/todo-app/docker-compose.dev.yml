services:
  proxy:
    image: nginx:alpine
    ports: ['8081:80']
    volumes: ['./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [todo-frontend, todo-backend]
  todo-frontend:
    build:
      context: ./todo-frontend
      dockerfile: dev.Dockerfile
    volumes: ['./todo-frontend:/app', 'todo-client-modules:/app/node_modules']
  todo-backend:
    build:
      context: ./todo-backend
      dockerfile: dev.Dockerfile
    volumes: ['./todo-backend:/app', 'todo-server-modules:/app/node_modules']
    environment:
      MONGO_URL: mongodb://mongo:27017/todos
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
  mongo:
    image: mongo:7
    volumes: ['todo-mongo:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 3s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['todo-redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 15
volumes:
  todo-mongo:
  todo-redis:
  todo-client-modules:
  todo-server-modules:
